
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>L'Oréal Beauty Assistant</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Material Icons -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- Header -->
    <header class="site-header">

      <!-- L'Oreal Branding -->
      <div class="brand">
  <img
    src="img/loreal-logo.png"
    alt="L'Oréal logo"
    class="brand-logo"
  />
  <p class="brand-subtitle">BEAUTY ASSISTANT</p>
</div>

      <p class="site-tagline">
        Your Personal AI Beauty Advisor
      </p>

    </header>

    <!-- Main Chat Area -->
    <main>
      <section class="chatbox">

        <div class="chat-intro">
          <h2>Discover Your Beauty</h2>
          <p>
            Explore skincare, makeup, haircare,
            fragrances, and personalized beauty
            recommendations.
          </p>
        </div>

        <!-- Chat Messages -->
        <div
          id="chatWindow"
          class="chat-window"
          role="log"
          aria-live="polite"
          aria-label="Chat conversation"
        >
          <!-- Messages added by JavaScript -->
        </div>

        <!-- Chat Input -->
        <form id="chatForm" class="chat-form">

          <label
            for="userInput"
            class="visually-hidden"
          >
            Your message
          </label>

          <input
            id="userInput"
            name="userInput"
            type="text"
            placeholder="Ask me about beauty products..."
            autocomplete="off"
            maxlength="2000"
            required
          />

          <button
            type="submit"
            id="sendBtn"
            aria-label="Send message"
          >
            <span class="material-icons">
              send
            </span>
          </button>

        </form>

      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>
        Educational AI chatbot project inspired
        by L'Oréal.
      </p>
      <p>
        AI recommendations may contain errors.
        Verify product details before purchasing.
      </p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
